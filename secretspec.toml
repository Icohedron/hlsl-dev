# Secrets this workspace can use, and where they come from.
#
# One secret, one consumer: `offloader-monitor` reads the GitHub API and its
# logs. Everything else here -- building compilers, running tests -- is
# offline as far as credentials go.
#
# The value is never written into devenv.nix or the Nix store: the task runs
# under `secretspec run`, which resolves it from whichever provider you have
# configured (keyring by default; env, dotenv, 1Password and others exist) and
# passes it to that one process.
#
#     secretspec config global init   # pick a provider, once per machine
#     secretspec set GH_TOKEN         # store the token in it
#     offloader-monitor               # picks it up from there
#
# In CI or a dev container there is usually a token in the environment already;
# the `env` provider hands that straight through, which is why the dev
# container forwards GH_TOKEN/GITHUB_TOKEN from the host.
[project]
name = "hlsl-devenv"
revision = "1.0"

[profiles.default]
GH_TOKEN = { description = "GitHub token for offloader-monitor; public-repo read scope is enough", required = false }
